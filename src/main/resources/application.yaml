spring:
  application:
    name: miku-miku-reservation-backend
  profiles:
    default: local
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  servlet:
    multipart:
      max-file-size: ${app.upload.max-size}
      max-request-size: ${app.upload.max-size}
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    redis:
      host: localhost
      port: 6379
  web:
    locale: ko_KR
    locale-resolver: fixed

app:
  upload:
    max-size: 5MB
    allowed-extensions: [jpg, jpeg, png, gif, webp]
  jwt:
    # 로그인 토큰 유효 시간(시간 단위). 서명 키(app.jwt.secret)는 프로파일별 파일에서 받는다
    expiration-hours: 24

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.jong.mikumikureservationbackend.vo
  configuration:
    map-underscore-to-camel-case: true
