# 운영
spring:
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}

app:
  upload:
    # 임시값: 웹호스팅이 정해지면 PROD_UPLOAD_DIR 환경변수로 실제 경로를 지정한다
    dir: ${PROD_UPLOAD_DIR:/data/figure-ledger/uploads}
  cors:
    allowed-origins: ${PROD_CORS_ORIGINS}
  jwt:
    # 환경변수 PROD_JWT_SECRET(32자 이상, 예: openssl rand -base64 48)이 없으면 기동에 실패한다
    secret: ${PROD_JWT_SECRET}
